- name: Debian test server configuration
  hosts: debian_test
  roles:
    - role: configure-system
      tags: [configure-system]

    - role: shell
      tags: [shell]
      vars:
        shell_hostname: "{{ hostname }}"
        shell_user: noxious
        shell_home_directory: /home/noxious

    - role: shell
      tags: [shell]
      vars:
        shell_hostname: "{{ hostname }}"
        shell_user: root
        shell_home_directory: /root
        shell_show_pretty_info: false

    - role: docker
      tags: [docker]

    - role: telegraf
      tags: [telegraf]
      vars:
        telegraf_influxdb_url: "https://influxdb.{{ domain }}"
        telegraf_influxdb_port: 8086
        telegraf_influxdb_organisation: "0dd8df669872ba9e"
        telegraf_influxdb_token: "{{ lookup('aws_ssm', '/homelab/influxdb/token', region='eu-west-1') }}"
        telegraf_influxdb_bucket: "home-server"

    - role: step-ca-client
      tags: [step-ca-client]
      vars:
        step_ca_client_provisioner_password: "{{ lookup('aws_ssm', '/homelab/step-ca/ansible-password', region='eu-west-1') }}"

    - role: syslog
      tags: [syslog]
      vars:
        syslog_fqdn: "{{ fqdn }}"
        # Shipping to both while the migration off Graylog is proven
        # (homelab-talos#178). Drop the Graylog entry once this host's logs
        # are confirmed in Loki; keeping both costs nothing but duplicates.
        #
        # octet-counted framing on the Loki receiver only: rsyslog's default
        # is newline-delimited, which makes the receiver wait for the next
        # message to know the current one ended, so a quiet host's last line
        # sits in limbo. Graylog's entry is left on the default rather than
        # changed alongside, so this is one variable at a time.
        syslog_destinations:
          - host: graylog.local.iamrobertyoung.co.uk
            port: 5140
          - host: syslog.k8s.local.iamrobertyoung.co.uk
            port: 6514
            framing: octet-counted

    - role: wazuh-agent
      tags: [wazuh-agent]

    - role: certbot
      tags: [certbot]
      vars:
        certbot_domain: "{{ fqdn }}"
        certbot_cert_name: "{{ hostname }}"
        certbot_aws_access_key: "{{ lookup('aws_ssm', '/homelab/certbot/access-key', region='eu-west-1') }}"
        certbot_aws_secret_access_key: "{{ lookup('aws_ssm', '/homelab/certbot/secret-access-key', region='eu-west-1') }}"
